name: tally-staging

services:
  web:
    image: ${TALLY_IMAGE:?Set TALLY_IMAGE to the immutable image tag}
    container_name: tally-staging-web
    env_file:
      - ${TALLY_ENV_FILE:-.env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      shared:
        aliases:
          - tally-staging-web

  mcp:
    image: ${TALLY_IMAGE:?Set TALLY_IMAGE to the immutable image tag}
    container_name: tally-staging-mcp
    command: ["node", "ops/mcp.mjs"]
    environment:
      NODE_ENV: "production"
      MCP_PORT: "3201"
      TALLY_API_BASE_URL: "http://tally-staging-web:3000"
      TALLY_PUBLIC_URL: "https://tally.jhmediagroup.com"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3201/mcp').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      shared:
        aliases:
          - tally-staging-mcp

networks:
  shared:
    external: true
    name: opt_default
